global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "books-api"
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["app:2223", "host.docker.internal:2223"]
        labels:
          environment: "development"
