run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - misspell

issues:
  exclude-rules:
    # Excluir archivos de mocks y tests de ciertos linters
    - path: "_test\\.go"
      linters:
        - errcheck
    - path: "mocks/"
      linters:
        - unused
        - revive
  # No limitar el número de issues reportados
  max-issues-per-linter: 0
  max-same-issues: 0
